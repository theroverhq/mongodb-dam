nameOverride: ""
fullnameOverride: ""

assignment:
  customerId: "customer-id"
  tenantId: "tenant-id"
  sourceId: "mongodb-source-id"
  regionalCellId: "regional-cell-id"
  clusterName: "customer-cluster"

secrets:
  # The default expects this Secret to be provisioned before Helm runs.
  existingSecret: mongodb-dam-secrets
  create: false
  observerInternalToken: ""
  bearerToken: ""
  principalHashSalt: ""
  mongodbRootUsername: ""
  mongodbRootPassword: ""

images:
  observer:
    repository: mongodb-dam-observer
    tag: dev
    pullPolicy: IfNotPresent
  outpost:
    repository: mongodb-dam-outpost
    tag: dev
    pullPolicy: IfNotPresent

destination:
  # "s3" writes gzip-compressed NDJSON objects. "http" remains available for
  # the bundled local receiver and the legacy regional HTTP-push contract.
  mode: http
  endpoint: https://regional-ingress.invalid/v1/ingest/mongodb-dam
  caSecretName: ""
  caSecretKey: destination-ca.pem
  s3:
    bucket: ""
    prefix: ""
    # Passed as AWS_REGION. The SDK gets credentials from its standard chain.
    region: ""
    # Demo/testing only; leave empty for AWS S3.
    endpointUrl: ""
    forcePathStyle: false
    # Optional Secret containing standard AWS credential values. Leave empty
    # to use EKS Pod Identity, IRSA, the node role, or another SDK provider.
    credentialsSecretName: ""
    accessKeyIdKey: aws-access-key-id
    secretAccessKeyKey: aws-secret-access-key
    sessionTokenKey: aws-session-token

mongodb:
  enabled: true
  image:
    repository: mongo
    # MongoDB 8 refuses to start on Linux kernels 6.19 through 7.0.13.
    # scripts/preflight.sh rejects those nodes for an 8.x tag.
    tag: 8.0.29-noble
    pullPolicy: IfNotPresent
  service:
    port: 27017
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}

observer:
  mongodbPort: 27017
  cpuProfileHz: 49
  tlsUprobes: auto
  lockProfiling: true
  maxMessageBytes: 50331648
  batchMaxEvents: 200
  batchFlushMilliseconds: 1000
  enabledEventTypes: all
  enabledMongodbCommands: all
  spoolMaxBytes: 268435456
  spoolHostPath: /var/lib/mongodb-dam/observer
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  nodeSelector:
    kubernetes.io/os: linux
  tolerations:
    - operator: Exists
  priorityClassName: ""

outpost:
  replicas: 1
  exportIntervalSeconds: 5
  spoolMaxBytes: 1073741824
  maxRequestBytes: 5242880
  identityMapping:
    # Demo-only trusted mapping used to attach an AWS IAM actor to a salted
    # MongoDB principal before export. Keep disabled unless explicitly used.
    enabled: false
    secretName: mongodb-dam-demo-direct-user
    key: identity-mapping.json
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Disposable presentation components. Enable only with deploy/examples/demo-values.yaml.
# The REST API generates MongoDB traffic; the receiver retains recent Outpost batches in memory.
demo:
  enabled: false
  database: dam_demo
  api:
    image:
      repository: mongodb-dam-demo-api
      tag: dev
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
  receiver:
    image:
      repository: mongodb-dam-mock-endpoint
      tag: dev
      pullPolicy: IfNotPresent
    maxRetainedBatches: 250
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 128Mi

networkPolicy:
  enabled: false

serviceMonitor:
  enabled: false
  interval: 30s
