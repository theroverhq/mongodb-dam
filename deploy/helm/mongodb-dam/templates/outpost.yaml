{{- if ne (int .Values.outpost.replicas) 1 }}
{{- fail "outpost.replicas must be 1 because the durable file spool is single-writer" }}
{{- end }}
{{- $destinationMode := lower .Values.destination.mode }}
{{- if not (has $destinationMode (list "http" "s3")) }}
{{- fail "destination.mode must be http or s3" }}
{{- end }}
{{- if and (eq $destinationMode "http") (empty .Values.destination.endpoint) }}
{{- fail "destination.endpoint is required when destination.mode=http" }}
{{- end }}
{{- if and (eq $destinationMode "s3") (empty .Values.destination.s3.bucket) }}
{{- fail "destination.s3.bucket is required when destination.mode=s3" }}
{{- end }}
{{- if and (eq $destinationMode "s3") (empty .Values.destination.s3.prefix) }}
{{- fail "destination.s3.prefix is required when destination.mode=s3" }}
{{- end }}
{{- if and (eq $destinationMode "s3") (empty .Values.destination.s3.region) }}
{{- fail "destination.s3.region is required when destination.mode=s3" }}
{{- end }}
{{- if and .Values.outpost.identityMapping.enabled (not (regexMatch "^[A-Za-z0-9._-]+$" .Values.outpost.identityMapping.key)) }}
{{- fail "outpost.identityMapping.key must be a single Kubernetes Secret data key" }}
{{- end }}
{{- if .Values.outpost.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mongodb-dam.fullname" . }}-outpost
  labels:
    {{- include "mongodb-dam.labels" . | nindent 4 }}
    app.kubernetes.io/component: outpost
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.outpost.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.outpost.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mongodb-dam.fullname" . }}-outpost
  labels:
    {{- include "mongodb-dam.labels" . | nindent 4 }}
    app.kubernetes.io/component: outpost
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mongodb-dam.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: outpost
  template:
    metadata:
      labels:
        {{- include "mongodb-dam.labels" . | nindent 8 }}
        app.kubernetes.io/component: outpost
    spec:
      serviceAccountName: {{ include "mongodb-dam.fullname" . }}-outpost
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: outpost
          image: "{{ .Values.images.outpost.repository }}:{{ .Values.images.outpost.tag }}"
          imagePullPolicy: {{ .Values.images.outpost.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: DAM_CUSTOMER_ID
              value: {{ required "assignment.customerId is required" .Values.assignment.customerId | quote }}
            - name: DAM_TENANT_ID
              value: {{ required "assignment.tenantId is required" .Values.assignment.tenantId | quote }}
            - name: DAM_SOURCE_ID
              value: {{ required "assignment.sourceId is required" .Values.assignment.sourceId | quote }}
            - name: DAM_REGIONAL_CELL_ID
              value: {{ required "assignment.regionalCellId is required" .Values.assignment.regionalCellId | quote }}
            - name: DAM_CLUSTER_NAME
              value: {{ required "assignment.clusterName is required" .Values.assignment.clusterName | quote }}
            - name: OUTPOST_INTERNAL_TOKEN_FILE
              value: /var/run/mongodb-dam/secrets/observer-internal-token
            - name: OUTPOST_DESTINATION
              value: {{ $destinationMode | quote }}
            {{- if eq $destinationMode "http" }}
            - name: OUTPOST_ENDPOINT
              value: {{ .Values.destination.endpoint | quote }}
            - name: OUTPOST_BEARER_TOKEN_FILE
              value: /var/run/mongodb-dam/secrets/bearer-token
            {{- else }}
            - name: OUTPOST_S3_BUCKET
              value: {{ .Values.destination.s3.bucket | quote }}
            - name: OUTPOST_S3_PREFIX
              value: {{ .Values.destination.s3.prefix | quote }}
            - name: AWS_REGION
              value: {{ .Values.destination.s3.region | quote }}
            {{- if .Values.destination.s3.endpointUrl }}
            - name: OUTPOST_S3_ENDPOINT_URL
              value: {{ .Values.destination.s3.endpointUrl | quote }}
            {{- end }}
            - name: OUTPOST_S3_FORCE_PATH_STYLE
              value: {{ .Values.destination.s3.forcePathStyle | quote }}
            {{- with .Values.destination.s3.credentialsSecretName }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.destination.s3.accessKeyIdKey | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.destination.s3.secretAccessKeyKey | quote }}
            - name: AWS_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.destination.s3.sessionTokenKey | quote }}
                  optional: true
            {{- end }}
            {{- end }}
            - name: OUTPOST_SPOOL_MAX_BYTES
              value: {{ int64 .Values.outpost.spoolMaxBytes | quote }}
            - name: OUTPOST_MAX_REQUEST_BYTES
              value: {{ int64 .Values.outpost.maxRequestBytes | quote }}
            - name: OUTPOST_EXPORT_INTERVAL_SECONDS
              value: {{ int64 .Values.outpost.exportIntervalSeconds | quote }}
            {{- if .Values.outpost.identityMapping.enabled }}
            - name: OUTPOST_IDENTITY_MAPPING_FILE
              value: {{ printf "/var/run/mongodb-dam/identity/%s" .Values.outpost.identityMapping.key | quote }}
            {{- end }}
            - name: KUBERNETES_SERVICE_HOST
              value: kubernetes.default.svc
            - name: KUBERNETES_SERVICE_PORT_HTTPS
              value: "443"
            {{- if and (eq $destinationMode "http") .Values.destination.caSecretName }}
            - name: OUTPOST_CA_FILE
              value: /var/run/mongodb-dam/destination-ca/{{ .Values.destination.caSecretKey }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.outpost.resources | nindent 12 }}
          volumeMounts:
            - name: spool
              mountPath: /var/lib/mongodb-dam/outpost
            - name: secrets
              mountPath: /var/run/mongodb-dam/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if .Values.outpost.identityMapping.enabled }}
            - name: identity-mapping
              mountPath: /var/run/mongodb-dam/identity
              readOnly: true
            {{- end }}
            {{- if and (eq $destinationMode "http") .Values.destination.caSecretName }}
            - name: destination-ca
              mountPath: /var/run/mongodb-dam/destination-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: spool
          {{- if .Values.outpost.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "mongodb-dam.fullname" . }}-outpost
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: secrets
          secret:
            secretName: {{ include "mongodb-dam.secretName" . }}
            items:
              - key: observer-internal-token
                path: observer-internal-token
              {{- if eq $destinationMode "http" }}
              - key: bearer-token
                path: bearer-token
              {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.outpost.identityMapping.enabled }}
        - name: identity-mapping
          secret:
            secretName: {{ required "outpost.identityMapping.secretName is required when identity mapping is enabled" .Values.outpost.identityMapping.secretName | quote }}
            optional: true
            items:
              - key: {{ required "outpost.identityMapping.key is required when identity mapping is enabled" .Values.outpost.identityMapping.key | quote }}
                path: {{ .Values.outpost.identityMapping.key | quote }}
        {{- end }}
        {{- if and (eq $destinationMode "http") .Values.destination.caSecretName }}
        - name: destination-ca
          secret:
            secretName: {{ .Values.destination.caSecretName }}
            items:
              - key: {{ .Values.destination.caSecretKey }}
                path: {{ .Values.destination.caSecretKey }}
        {{- end }}
      {{- with .Values.outpost.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.outpost.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.outpost.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mongodb-dam.fullname" . }}-outpost
  labels:
    {{- include "mongodb-dam.labels" . | nindent 4 }}
    app.kubernetes.io/component: outpost
spec:
  selector:
    app.kubernetes.io/name: {{ include "mongodb-dam.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: outpost
  ports:
    - name: http
      port: 8090
      targetPort: http
