apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "mongodb-dam.fullname" . }}-observer
  labels:
    {{- include "mongodb-dam.labels" . | nindent 4 }}
    app.kubernetes.io/component: observer
spec:
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mongodb-dam.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: observer
  template:
    metadata:
      labels:
        {{- include "mongodb-dam.labels" . | nindent 8 }}
        app.kubernetes.io/component: observer
    spec:
      serviceAccountName: {{ include "mongodb-dam.fullname" . }}-observer
      automountServiceAccountToken: false
      hostPID: true
      dnsPolicy: ClusterFirst
      terminationGracePeriodSeconds: 20
      {{- with .Values.observer.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: observer
          image: "{{ .Values.images.observer.repository }}:{{ .Values.images.observer.tag }}"
          imagePullPolicy: {{ .Values.images.observer.pullPolicy }}
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
            runAsUser: 0
            seccompProfile:
              type: Unconfined
          env:
            - name: DAM_CUSTOMER_ID
              value: {{ required "assignment.customerId is required" .Values.assignment.customerId | quote }}
            - name: DAM_TENANT_ID
              value: {{ required "assignment.tenantId is required" .Values.assignment.tenantId | quote }}
            - name: DAM_SOURCE_ID
              value: {{ required "assignment.sourceId is required" .Values.assignment.sourceId | quote }}
            - name: DAM_REGIONAL_CELL_ID
              value: {{ required "assignment.regionalCellId is required" .Values.assignment.regionalCellId | quote }}
            - name: DAM_CLUSTER_NAME
              value: {{ required "assignment.clusterName is required" .Values.assignment.clusterName | quote }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OBSERVER_OUTPOST_URL
              value: http://{{ include "mongodb-dam.fullname" . }}-outpost:8090/v1/observer/batches
            - name: OBSERVER_INTERNAL_TOKEN_FILE
              value: /var/run/mongodb-dam/secrets/observer-internal-token
            - name: OBSERVER_PRINCIPAL_HASH_SALT_FILE
              value: /var/run/mongodb-dam/secrets/principal-hash-salt
            - name: OBSERVER_CPU_PROFILE_HZ
              value: {{ int64 .Values.observer.cpuProfileHz | quote }}
            - name: OBSERVER_MONGODB_PORT
              value: {{ int64 .Values.observer.mongodbPort | quote }}
            - name: OBSERVER_TLS_UPROBES
              value: {{ .Values.observer.tlsUprobes | quote }}
            - name: OBSERVER_LOCK_PROFILING
              value: {{ .Values.observer.lockProfiling | quote }}
            - name: OBSERVER_MAX_MESSAGE_BYTES
              value: {{ int64 .Values.observer.maxMessageBytes | quote }}
            - name: OBSERVER_BATCH_MAX_EVENTS
              value: {{ int64 .Values.observer.batchMaxEvents | quote }}
            - name: OBSERVER_BATCH_FLUSH_MILLISECONDS
              value: {{ int64 .Values.observer.batchFlushMilliseconds | quote }}
            - name: OBSERVER_SPOOL_MAX_BYTES
              value: {{ int64 .Values.observer.spoolMaxBytes | quote }}
          ports:
            - name: metrics
              containerPort: 8091
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.observer.resources | nindent 12 }}
          volumeMounts:
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: tracefs
              mountPath: /sys/kernel/tracing
              readOnly: true
            - name: debugfs
              mountPath: /sys/kernel/debug
              readOnly: true
            - name: btf
              mountPath: /sys/kernel/btf
              readOnly: true
            - name: spool
              mountPath: /var/lib/mongodb-dam/observer
            - name: secrets
              mountPath: /var/run/mongodb-dam/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
            type: Directory
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        - name: btf
          hostPath:
            path: /sys/kernel/btf
            type: Directory
        - name: spool
          hostPath:
            path: {{ .Values.observer.spoolHostPath }}
            type: DirectoryOrCreate
        - name: secrets
          secret:
            secretName: {{ include "mongodb-dam.secretName" . }}
            items:
              - key: observer-internal-token
                path: observer-internal-token
              - key: principal-hash-salt
                path: principal-hash-salt
        - name: tmp
          emptyDir: {}
      {{- with .Values.observer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.observer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mongodb-dam.fullname" . }}-observer
  labels:
    {{- include "mongodb-dam.labels" . | nindent 4 }}
    app.kubernetes.io/component: observer
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ include "mongodb-dam.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: observer
  ports:
    - name: metrics
      port: 8091
      targetPort: metrics
