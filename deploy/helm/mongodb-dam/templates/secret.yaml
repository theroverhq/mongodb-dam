{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mongodb-dam.secretName" . }}
  labels:
    {{- include "mongodb-dam.labels" . | nindent 4 }}
type: Opaque
stringData:
  observer-internal-token: {{ required "secrets.observerInternalToken is required" .Values.secrets.observerInternalToken | quote }}
  collect-token: {{ required "secrets.collectToken is required" .Values.secrets.collectToken | quote }}
  principal-hash-salt: {{ required "secrets.principalHashSalt is required" .Values.secrets.principalHashSalt | quote }}
  mongodb-root-username: {{ required "secrets.mongodbRootUsername is required" .Values.secrets.mongodbRootUsername | quote }}
  mongodb-root-password: {{ required "secrets.mongodbRootPassword is required" .Values.secrets.mongodbRootPassword | quote }}
{{- end }}
