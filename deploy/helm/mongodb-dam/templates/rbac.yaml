apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mongodb-dam.fullname" . }}-outpost
  labels:
    {{- include "mongodb-dam.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mongodb-dam.fullname" . }}-outpost
  labels:
    {{- include "mongodb-dam.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "mongodb-dam.fullname" . }}-outpost
subjects:
  - kind: ServiceAccount
    name: {{ include "mongodb-dam.fullname" . }}-outpost
    namespace: {{ .Release.Namespace }}
