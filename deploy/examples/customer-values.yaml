assignment:
  customerId: customer-acme
  tenantId: tenant-acme
  sourceId: mongodb-prod-ap-south-1
  regionalCellId: cell-ap-south-1
  clusterName: acme-production-eks

images:
  observer:
    repository: 111122223333.dkr.ecr.ap-south-1.amazonaws.com/mongodb-dam-observer
    tag: v0.1.0
    pullPolicy: IfNotPresent
  outpost:
    repository: 111122223333.dkr.ecr.ap-south-1.amazonaws.com/mongodb-dam-outpost
    tag: v0.1.0
    pullPolicy: IfNotPresent

destination:
  mode: s3
  s3:
    bucket: replace-with-dam-demo-bucket
    prefix: mongodb-dam/events
    region: ap-south-1
    # scripts/deploy.sh fills this automatically when OUTPOST_AWS_* static
    # credentials are present in .env. Leave empty for EKS-native providers.
    credentialsSecretName: ""

mongodb:
  persistence:
    size: 100Gi
    storageClass: gp3

outpost:
  persistence:
    size: 20Gi
    storageClass: gp3
