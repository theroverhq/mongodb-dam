[workspace]
members = [
    "crates/schema",
    "crates/mongo-protocol",
    "crates/spool",
    "crates/observer",
    "crates/outpost",
    "crates/mock-endpoint",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
aws-config = { version = "=1.8.12", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "=1.119.0", default-features = false, features = ["default-https-client", "rt-tokio", "rustls"] }
axum = "0.7"
bytes = "1.7"
clap = { version = "4.5", features = ["derive", "env"] }
flate2 = "1.0"
hex = "0.4"
http = "1.1"
libbpf-rs = "0.25"
libbpf-sys = { version = "1.5.1", default-features = false, features = ["vendored-libbpf"] }
libc = "0.2"
prometheus = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
snap = "1.1"
tempfile = "3.10"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "macros", "serde", "serde-well-known"] }
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.6", features = ["limit", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
zstd = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
